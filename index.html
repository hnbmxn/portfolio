<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Omori Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 英字は Press Start 2P、数字と日本語は DotGothic16（作品一覧と同じ）。
       Press Start 2P は英字と記号だけを読み込む（text=…）ので数字を持たず、数字は後ろの DotGothic16 で表示される -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&text=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz.,:;!%3F'%22()%5B%5D%2F-_%26%20&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // JSが動く環境では、玉が輪になるまでメニューを隠しておく（読み込みに失敗しても4秒後には必ず表示）
    document.documentElement.classList.add('js');
    setTimeout(function () { var m = document.getElementById('menu'); if (m) m.classList.remove('pre'); }, 4000);
  </script>
</head>
<body>
  <canvas id="orbs" aria-hidden="true"></canvas>

  <div class="screen">
    <header>
      <h1 class="site-title">Omori Portfolio</h1>
    </header>

    <main class="stage">
      <div class="orb-anchor" id="orb-anchor" aria-hidden="true"></div>

      <nav class="menu pre" id="menu" aria-label="メニュー">
        <ul>
          <li><a href="works/" data-key="portfolio" data-dist="0">Portfolio</a></li>
          <li><a href="#profile" data-key="profile" data-dist="1">Profile</a></li>
          <li><a href="#contact" data-key="contact" data-dist="2">Contact</a></li>
        </ul>
      </nav>

      <!-- 決定後に出る仮の画面。各ページができたら差し替える -->
      <section class="page" id="page" hidden aria-labelledby="page-title">
        <h2 class="page-title" id="page-title">Portfolio</h2>
        <p class="page-note">このページの中身はこれから作ります（Escで戻る）</p>
        <button class="btn" id="back-btn" type="button">BACK</button>
      </section>

      <!-- Profile：履歴書風。文字はHOMEと同じドット文字。動くのは証明写真（APNG）だけ（開く・閉じるは js/profile.js） -->
      <section class="profile" id="profile" hidden aria-labelledby="pf-title">
        <div class="pf-inner">
          <h2 class="pf-title" id="pf-title">Profile</h2>

          <div class="pf-sheet">
            <div class="pf-top">
              <!-- 左：記入欄 -->
              <div class="pf-box pf-fields">
                <div class="pf-namegroup">
                  <div class="pf-row pf-kana"><span class="pf-label">ふりがな</span><span class="pf-value">おおもり</span></div>
                  <div class="pf-row pf-namerow">
                    <span class="pf-label">氏名</span>
                    <span class="pf-value pf-name">大森</span>
                  </div>
                  <!-- 丸を付ける方の span に class="is-circled" を付けると、丸で囲まれる -->
                  <div class="pf-gender"><span class="is-circled">男</span>・<span>女</span></div>
                </div>
                <div class="pf-row"><span class="pf-label">生年月日</span><span class="pf-value">○○○○年生まれ</span></div>
                <div class="pf-row pf-kana"><span class="pf-label">ふりがな</span><span class="pf-value">○○けん ○○し</span></div>
                <div class="pf-row"><span class="pf-label">現住所</span><span class="pf-value">○○県○○市あたり</span></div>
                <div class="pf-row"><span class="pf-label">連絡先</span><span class="pf-value">Contact からどうぞ</span></div>
              </div>

              <!-- 右：証明写真（3:4）。写真ができたら、下の p を <img src="assets/profile/photo.png" alt="大森の写真"> に差し替える -->
              <figure class="pf-box pf-photo">
                <p class="pf-photo-note">写真をはる位置</p>
              </figure>
            </div>

            <!-- 下：制作について（罫線の上に書く） -->
            <section class="pf-box pf-about" aria-labelledby="pf-about-label">
              <h3 class="pf-about-label" id="pf-about-label">制作について</h3>
              <p class="pf-value pf-lines">ここに、制作への思いやこれまでの経歴が入ります。どんなきっかけでものづくりを始めたか、制作で大事にしていること、これから挑戦したいことを、200〜300字くらいでまとめます。</p>
            </section>
          </div>

          <button class="btn pf-back" id="pf-back" type="button">BACK</button>
        </div>
      </section>
    </main>

    <footer class="foot">
      <button class="btn sound" id="sound-btn" type="button" aria-pressed="false">
        <span class="lamp" aria-hidden="true"></span><span id="sound-label">SOUND OFF</span>
      </button>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
